<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CNR ML Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CNR Machine Learning Laboratory</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://ml.chakudya.xyz http://localhost:8000 http://127.0.0.1:8000; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="install-bar" hidden>
  <span id="install-text">Install CNR ML Lab on this device for one-tap access.</span>
  <button id="install" class="primary">Install app</button>
  <button id="install-dismiss" class="link" aria-label="Hide install banner">Not now</button>
</div>
<section id="login" hidden>
  <div class="login-card">
    <h1>CNR Machine Learning Laboratory</h1>
    <p>Sign in with your laboratory API key. Ask an administrator if you do not have one.</p>
    <label for="key">API key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false">
    <button id="signin" class="primary">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </div>
</section>

<div id="app" hidden>
  <aside>
    <div class="brand">CNR ML Laboratory</div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="who"><span id="who"></span><button id="signout" class="link">Sign out</button></div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
