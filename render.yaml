# Render Blueprint. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: cnr-ml-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /health
    disk:
      name: mlab-data
      mountPath: /srv/data
      sizeGB: 5
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_KEY
        sync: false
      - key: PSEUDONYM_KEY
        sync: false
      - key: DATASET_STORAGE_DIR
        value: /srv/data/datasets
      - key: CORS_ORIGINS
        value: https://ml-lab.chakudya.xyz
      - key: CNR_API_BASE_URL
        value: https://api.chakudya.xyz
      - key: CNR_WEBHOOK_URL
        value: https://api.chakudya.xyz/hooks/ml-lab
      - key: CNR_WEBHOOK_SECRET
        sync: false
      - key: SURVEILLANCE_SYNC_ENABLED
        value: "true"
      - key: SURVEILLANCE_API_KEY
        sync: false
      # Record-level (de-identified) training rows from CNR: opt in deliberately.
      - key: TRAINING_SYNC_ENABLED
        value: "false"
      # LLM intelligence (phase 1). Server-side only: the consumer key is a secret entered in the Render dashboard.
      - key: LLM_ENABLED
        value: "false"
      - key: CHAKUDYA_API_URL
        value: https://api.chakudya.xyz
      # Optional dedicated key. Left empty, the lab reuses SURVEILLANCE_API_KEY (below), because LLM_USE_SURVEILLANCE_KEY is true.
      - key: CHAKUDYA_CONSUMER_KEY
        sync: false
      - key: LLM_USE_SURVEILLANCE_KEY
        value: "true"
      - key: LLM_IDENTIFIER_POLICY
        value: reject
      # LLM intelligence (phase 4): clinical document summarisation. Off until you set SUMMARY_ENABLED=true.
      # GROQ_API_KEY is a secret: enter it in the Render dashboard (never in this file). The model is shown only extracted facts, never the note.
      - key: SUMMARY_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
  - type: web
    name: cnr-ml-lab-dashboard
    runtime: static
    staticPublishPath: ./dashboard
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
