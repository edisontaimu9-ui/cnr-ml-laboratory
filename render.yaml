# Render Blueprint. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: cnr-ml-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /health
    disk:
      name: mlab-data
      mountPath: /srv/data
      sizeGB: 5
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_KEY
        sync: false
      - key: PSEUDONYM_KEY
        sync: false
      - key: DATASET_STORAGE_DIR
        value: /srv/data/datasets
      - key: CORS_ORIGINS
        value: https://ml-lab.chakudya.xyz
      - key: CNR_API_BASE_URL
        value: https://api.chakudya.xyz
      - key: CNR_WEBHOOK_URL
        value: https://api.chakudya.xyz/hooks/ml-lab
      - key: CNR_WEBHOOK_SECRET
        sync: false
      - key: SURVEILLANCE_SYNC_ENABLED
        value: "true"
      - key: SURVEILLANCE_API_KEY
        sync: false
      # Record-level (de-identified) training rows from CNR: opt in deliberately.
      - key: TRAINING_SYNC_ENABLED
        value: "false"
  - type: web
    name: cnr-ml-lab-dashboard
    runtime: static
    staticPublishPath: ./dashboard
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
