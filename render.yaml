# Render Blueprint. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: cnr-ml-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ml-lab.chakudya.xyz
      - key: CNR_API_BASE_URL
        value: https://chakudya-api.edisontaimu9.workers.dev
  - type: web
    name: cnr-ml-lab-dashboard
    runtime: static
    staticPublishPath: ./dashboard
